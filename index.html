<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>大話骰 v8 Stable</title><style>:root{--bg:#0b2f1d;--bg2:#07160f;--card:#0b2015;--txt:#e9f6ea;--muted:#97b7a0;--btn:#55d66a;--die:58px}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:10px;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;color:var(--txt);background:radial-gradient(900px 500px at 50% 35%,#1d5a3a 0%,transparent 65%),linear-gradient(180deg,var(--bg),var(--bg2))}.app{width:min(100%,430px)}.title{text-align:center}.title h1{margin:0;font-size:40px}.sub{color:var(--muted);font-weight:600;letter-spacing:1px}.pill{margin:12px auto;display:block;width:max-content;padding:8px 16px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff2a;color:#97e89f;font-weight:800}.stage{border:1px solid #ffffff1f;border-radius:18px;background:#0000002e;padding:14px;box-shadow:0 14px 30px #0000005a}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;justify-items:center;min-height:92px;align-items:center}.die{position:relative;width:var(--die);height:var(--die);border-radius:14px;background:linear-gradient(145deg,#fff,#ecf2f7);border:1px solid #c6ced6;box-shadow:0 7px 14px rgba(0,0,0,.42), inset -4px -5px 8px rgba(0,0,0,.07), inset 4px 4px 8px rgba(255,255,255,.85);transform:translateY(0)}.die::after{content:"";position:absolute;left:8px;right:8px;bottom:-8px;height:10px;border-radius:50%;background:rgba(0,0,0,.34);filter:blur(2px);z-index:-1}.face{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:12%;gap:6%}.pip{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2a3440,#111821)}.v1 .pip:nth-child(1){grid-area:2/2}.v2 .pip:nth-child(1){grid-area:1/1}.v2 .pip:nth-child(2){grid-area:3/3}.v3 .pip:nth-child(1){grid-area:1/1}.v3 .pip:nth-child(2){grid-area:2/2}.v3 .pip:nth-child(3){grid-area:3/3}.v4 .pip:nth-child(1){grid-area:1/1}.v4 .pip:nth-child(2){grid-area:1/3}.v4 .pip:nth-child(3){grid-area:3/1}.v4 .pip:nth-child(4){grid-area:3/3}.v5 .pip:nth-child(1){grid-area:1/1}.v5 .pip:nth-child(2){grid-area:1/3}.v5 .pip:nth-child(3){grid-area:2/2}.v5 .pip:nth-child(4){grid-area:3/1}.v5 .pip:nth-child(5){grid-area:3/3}.v6 .pip:nth-child(1){grid-area:1/1}.v6 .pip:nth-child(2){grid-area:1/3}.v6 .pip:nth-child(3){grid-area:2/1}.v6 .pip:nth-child(4){grid-area:2/3}.v6 .pip:nth-child(5){grid-area:3/1}.v6 .pip:nth-child(6){grid-area:3/3}.roll{animation:roll .68s cubic-bezier(.22,.8,.34,1)}@keyframes roll{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(-14px) rotate(-12deg)}55%{transform:translateY(6px) rotate(10deg)}100%{transform:translateY(0) rotate(0)}}.btn{margin-top:12px;width:100%;border:none;border-radius:16px;padding:14px 16px;font-size:34px;font-weight:900;letter-spacing:3px;color:#08220f;background:linear-gradient(180deg,#79e67f,#3ec65a);box-shadow:0 12px 24px #26b84a66}.res{margin-top:12px;border:1px solid #ffffff1f;border-radius:14px;background:#0000002a;padding:12px;text-align:center}.vals{font-size:32px;font-weight:900;letter-spacing:6px;color:#8ef59b}.sum{font-size:44px;font-weight:900}.tip{margin-top:8px;color:#89a594;font-size:13px}</style></head><body><main class="app"><section class="title"><h1>🎲 大話骰</h1><div class="sub">STABLE MOBILE VERSION</div></section><span class="pill">總點數：<span id="sumTop">0</span></span><section class="stage"><div class="row" id="row"></div></section><button class="btn" id="roll">擲骰</button><section class="res"><div style="color:#9bc4a7">結果</div><div class="vals" id="vals">- ・ - ・ - ・ - ・ -</div><div class="sum" id="sum">0</div><div class="tip">提示：可輪流擲，方便朋友聚會玩大話骰</div></section></main><script>const row=document.getElementById('row'),vals=document.getElementById('vals'),sum=document.getElementById('sum'),sumTop=document.getElementById('sumTop');const map={1:[[2,2]],2:[[1,1],[3,3]],3:[[1,1],[2,2],[3,3]],4:[[1,1],[1,3],[3,1],[3,3]],5:[[1,1],[1,3],[2,2],[3,1],[3,3]],6:[[1,1],[1,3],[2,1],[2,3],[3,1],[3,3]]};function mk(){const d=document.createElement('div');d.className='die';const f=document.createElement('div');f.className='face';d.appendChild(f);row.appendChild(d);return d}const dice=Array.from({length:5},mk);function draw(d,n){const f=d.firstChild;f.className='face v'+n;f.innerHTML='';map[n].forEach(([r,c])=>{const p=document.createElement('span');p.className='pip';p.style.gridRow=r;p.style.gridColumn=c;f.appendChild(p);});}function go(){const nums=[];dice.forEach((d,i)=>{const n=Math.floor(Math.random()*6)+1;nums.push(n);d.classList.remove('roll');void d.offsetWidth;d.classList.add('roll');setTimeout(()=>draw(d,n),120+i*25)});setTimeout(()=>{const s=nums.reduce((a,b)=>a+b,0);vals.textContent=nums.join(' ・ ');sum.textContent=s;sumTop.textContent=s},720)}document.getElementById('roll').addEventListener('click',go);setTimeout(go,120);</script></body></html>
